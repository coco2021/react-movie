name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      - name: Check TMDB token
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.themoviedb.org/3/configuration" \
            -H "Authorization: Bearer $VITE_TMDB_API_KEY" \
            -H "accept: application/json")

          if [ "$STATUS" != "200" ]; then
            echo "TMDB rejected the GitHub token. HTTP status: $STATUS"
            exit 1
          fi

          echo "TMDB accepted the GitHub token"



      - name: Build
        working-directory: react-app
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_APPWRITE_PROJECT_ID: ${{ secrets.VITE_APPWRITE_PROJECT_ID }}
          VITE_APPWRITE_DATABASE_ID: ${{ secrets.VITE_APPWRITE_DATABASE_ID }}
          VITE_APPWRITE_COLLECTION_ID: ${{ secrets.VITE_APPWRITE_COLLECTION_ID }}
        run: |
          echo "VITE_TMDB_API_KEY=$VITE_TMDB_API_KEY" > .env.production
          echo "VITE_APPWRITE_PROJECT_ID=$VITE_APPWRITE_PROJECT_ID" >> .env.production
          echo "VITE_APPWRITE_DATABASE_ID=$VITE_APPWRITE_DATABASE_ID" >> .env.production
          echo "VITE_APPWRITE_COLLECTION_ID=$VITE_APPWRITE_COLLECTION_ID" >> .env.production
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: react-app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4